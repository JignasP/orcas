name: Initial demo checks

on:
  push:
  pull_request:

jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orcas
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: orcas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orcas -d orcas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://orcas:test-only@localhost:5432/orcas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r services/gateway/requirements.txt langgraph pyyaml jsonschema pytest httpx ruff
      - name: Lint platform code
        run: ruff check --isolated --select E4,E7,E9,F,I libs services/gateway services/worker/clients/retrieval.py scripts/demo tests/platform
      - name: Test platform and agent
        run: python -m pytest tests/platform tests/agent -q
      - name: Validate Compose configuration
        run: docker compose config --quiet
