name: Platform checks

on:
  push:
  pull_request:

jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orcas
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: orcas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orcas -d orcas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://orcas:test-only@localhost:5432/orcas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r services/gateway/requirements.txt langgraph pyyaml jsonschema pytest httpx ruff redis
      - name: Lint platform code
        run: ruff check --isolated --select E4,E7,E9,F,I libs services/gateway services/metrics_exporter services/worker/tasks.py services/worker/clients/retrieval.py services/worker/clients/observed_retrieval.py services/worker/clients/llm_client.py services/retrieval/app.py services/llm_gateway/app.py scripts/doctor.py scripts/check_repository.py loadtest/locustfile.py tests/platform
      - name: Test platform and agent
        run: python -m pytest tests/platform tests/agent tests/web -q
      - name: Check tracked configuration and credentials
        run: python scripts/check_repository.py
      - name: Compile load and operations scripts
        run: python -m compileall -q loadtest/locustfile.py scripts/doctor.py
      - name: Validate Compose configuration
        run: docker compose config --quiet

  compose-smoke:
    if: github.event_name == 'pull_request'
    needs: platform
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stub-backed stack
        run: docker compose up --build -d
      - name: Wait for service readiness
        run: |
          for attempt in $(seq 1 60); do
            if python scripts/doctor.py; then exit 0; fi
            sleep 5
          done
          docker compose ps --all
          exit 1
      - name: Exercise complaint intake and quarantine
        run: python scripts/demo/initial_demo.py --timeout 180
      - name: Show service status and logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --tail 100
      - name: Stop the stack
        if: always()
        run: docker compose down -v
