# ORCAS corpus manifest
#
# Single source of truth for the raw regulatory documents under corpus/raw/.
# Every document is pinned by the version actually downloaded (SEBI re-issues master
# circulars; RBI amends schemes). Never fabricate checksums or versions — a field is
# either the real value of the file on disk or left null with status: pending_download.
#
# Fields per document:
#   doc_id          stable id used as the Chroma doc_id and in citations
#   title           official title
#   issuer          SEBI | RBI
#   framework       SEBI | RBI  (used by the retrieval `framework` filter)
#   source_url      the exact URL the file was downloaded from
#   version         version/date as printed on/declared by the document
#   downloaded_at   ISO date the file was fetched
#   sha256          sha256 of the file in corpus/raw/ (real, computed)
#   has_text_layer  true if a text layer exists (pdftotext yields real text)
#   ocr_applied     true if we had to OCR a scanned document before indexing
#   file            path under corpus/raw/
#   status          indexed_ready | pending_download
#   notes           supersession, coverage, caveats

