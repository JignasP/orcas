schema: orcas.scenarios.v1
note: Evaluation scenarios (>=20). Synthetic only. held_out=true scenarios are excluded from any prompt/retrieval
  tuning (including the LLM stub's keyword rules) and reported separately (anti-overfitting).
  supporting_passage clause_ids/quotes pinned from the clause-aligned index. expected_intake=rejected
  marks complaints the gateway must quarantine before any run; the harness checks that against the
  gateway guardrail and also runs them straight through the agent to test its own defence. Labels to be
  peer-reviewed against the actual clauses (docs/work/tahir/scenario-review.md).
coverage:
  bank_fd_4_1: 3
  mutual_fund: 2
  broker: 2
  registrar: 2
  listed_company: 2
  depository: 2
  rbi_payment: 2
  split_regulators: 2
  out_of_corpus: 2
  prompt_injection: 5
  ambiguous: 1
scenarios:
- id: ref_4_1_bank_fd
  complaint_text: I invested in a fixed deposit through my bank's app. The interest credited is lower
    than what I was promised. I want to complain to SEBI.
  expected_route: refer_to_other_regulator
  expected_regulator: RBI
  expected_entity_type: bank
  expected_escalation: false
  held_out: false
  supporting_passage:
    doc_id: rbi_integrated_ombudsman_scheme_2021
    clause_id: '9'
    quote: deficiency in service may file a complaint under the Scheme personally or through an authorised
      representative as defined under clause
  notes: §4.1 reference case.
- id: ref_4_1_paraphrase_1
