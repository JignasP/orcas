  expected_escalation: false
  held_out: false
  supporting_passage:
    doc_id: sebi_mutual_funds_regulations_1996
    clause_id: 60-2
    quote: The asset management company shall redress investor grievances promptly but not later than
      twenty-one calendar days from the date of receipt of the grievance
  notes: 'MF servicing: redemption/NAV. Regulation 60A (AMC must redress grievances within 21 days;
    indexed under clause 60-2). Re-pinned 2026-11-03: the old pin was an amendment footnote.'
